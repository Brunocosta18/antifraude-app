services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: antifraude-api:local
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "3000"
      LOG_LEVEL: info
      CORS_ORIGIN: http://localhost:8081
      # Segredo só em runtime, vindo do .env local (nunca gravado na imagem)
      URLHAUS_AUTH_KEY: ${URLHAUS_AUTH_KEY:-}
      THREAT_FEED_TIMEOUT_MS: "2000"
      RATE_LIMIT_MAX: "30"
      RATE_LIMIT_WINDOW_MS: "60000"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 10s
    restart: unless-stopped
