services:
  - type: web
    name: antifraude-api
    runtime: docker
    plan: free
    region: virginia # mais próxima do Brasil entre as regiões do Render
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeployTrigger: checksPass # só faz deploy depois que o CI (ANTIGOL-013) passa
    envVars:
      - { key: NODE_ENV, value: production }
      - { key: HOST, value: 0.0.0.0 }
      - { key: PORT, value: "3000" } # coerente com o EXPOSE/HEALTHCHECK do Dockerfile
      - { key: LOG_LEVEL, value: info }
      - { key: TRUST_PROXY, value: "1" } # 1 salto: IP real do cliente vem do X-Forwarded-For do Render
      - { key: THREAT_FEED_TIMEOUT_MS, value: "2000" }
      - { key: PHISHING_DB_ENABLED, value: "true" } # lista pública Phishing.Database (ANTIGOL-016), baixada pelo servidor
      - { key: RATE_LIMIT_MAX, value: "30" }
      - { key: RATE_LIMIT_WINDOW_MS, value: "60000" }
      - { key: CORS_ORIGIN, sync: false } # preenchido no painel (origem da PWA, ANTIGOL-015)
      - { key: URLHAUS_AUTH_KEY, sync: false } # segredo: só no painel, nunca no repositório
      - { key: FEEDBACK_HMAC_SECRET, sync: false } # segredo (>= 32 caracteres) da targetRef do feedback (ANTIGOL-017)
